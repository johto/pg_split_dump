name: Test
on:
  push:
     branches:
       - ghat
       - main

  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        pg: [18, 17, 16, 15, 14]
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pgxn/postgres-action@20634a28d5144c5ed858029032843906b7886d94 # v0.3.0
        with:
          version: ${{ matrix.pg }}

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable

      - name: Build pg_split_dump
        run: cargo build --verbose --features=warnings-as-errors
      - name: Build tar_diff
        working-directory: tar_diff
        run: cargo build --verbose --features=warnings-as-errors
      - name: Build create_expected_archive
        working-directory: tests/bin/create_expected_archive
        run: cargo build --verbose --features=warnings-as-errors
      - name: Test on PostgreSQL ${{ matrix.pg }}
        working-directory: tests
        run: ./run_tests.sh
