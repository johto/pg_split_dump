name: CI
on:
  push:
     branches:
       - main

  pull_request:

jobs:
  build:
    name: Build debug binary Ubuntu Jammy
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        architecture:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
      fail-fast: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          target: ${{ matrix.architecture }}

      - name: Install cross
        shell: bash
        run: |
            _DIR="$RUNNER_TEMP/cross"
            mkdir "$_DIR"
            echo "$_DIR" >> $GITHUB_PATH
            cd "$_DIR"

            echo 'a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588  cross-x86_64-unknown-linux-musl.tar.gz' > sha256sum
            curl -LO 'https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz'
            sha256sum --check sha256sum

            tar xf cross-x86_64-unknown-linux-musl.tar.gz

      - name: Build pg_split_dump
        run: cross build --verbose --target ${{ matrix.architecture }}

      - name: Archive built pg_split_dump binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg_split_dump-${{ matrix.architecture }}
          path: target/${{ matrix.architecture }}/debug/pg_split_dump

      - name: Build tar_diff
        working-directory: tar_diff
        run: cross build --verbose --target ${{ matrix.architecture }}

      - name: Archive built tar_diff binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tar_diff-${{ matrix.architecture }}
          path: tar_diff/target/${{ matrix.architecture }}/debug/tar_diff
